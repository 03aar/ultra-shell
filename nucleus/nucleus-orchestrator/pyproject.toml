[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "nucleus-orchestrator"
version = "1.0.0"
description = "AI agent orchestration layer for Nucleus shell engine"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=12.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "anthropic>=0.25.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
google = ["google-generativeai>=0.5.0"]

[project.scripts]
nucleus-agent = "nucleus_orchestrator.cli:app"
