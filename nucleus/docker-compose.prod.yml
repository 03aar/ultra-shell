version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      nucleus-api:
        condition: service_healthy
      nucleus-dashboard:
        condition: service_started
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nucleus-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nucleus
      POSTGRES_USER: nucleus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./nucleus-api/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nucleus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nucleus-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - nucleus-net

  nucleus-core:
    build:
      context: ./nucleus-core
      dockerfile: Dockerfile
    environment:
      NUCLEUS_REDIS_URL: redis://redis:6379
      NUCLEUS_DATA_DIR: /data/nucleus
      RUST_LOG: warn
    volumes:
      - nucleus_data:/data/nucleus
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - nucleus-net

  nucleus-api:
    build:
      context: ./nucleus-api
      dockerfile: Dockerfile
    environment:
      NUCLEUS_REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://nucleus:${POSTGRES_PASSWORD}@postgres:5432/nucleus?sslmode=disable
      PORT: "8080"
      GIN_MODE: release
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - nucleus-net

  nucleus-mcp:
    build:
      context: ./nucleus-mcp
      dockerfile: Dockerfile
    environment:
      NUCLEUS_API_URL: http://nucleus-api:8080
      NUCLEUS_API_KEY: ${NUCLEUS_API_KEY:?Set NUCLEUS_API_KEY in .env}
    depends_on:
      nucleus-api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    networks:
      - nucleus-net

  nucleus-dashboard:
    build:
      context: ./nucleus-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-/ws}
        NEXT_PUBLIC_API_KEY: ${NUCLEUS_API_KEY}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - nucleus-net

  nucleus-orchestrator:
    build:
      context: ./nucleus-orchestrator
      dockerfile: Dockerfile
    environment:
      NUCLEUS_API_URL: http://nucleus-api:8080/api/v1
      NUCLEUS_API_KEY: ${NUCLEUS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      nucleus-api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - nucleus-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nucleus_data:
    driver: local

networks:
  nucleus-net:
    driver: bridge
