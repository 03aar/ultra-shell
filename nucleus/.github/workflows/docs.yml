name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "nucleus/docs/**"
      - "nucleus/nucleus-docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find docs directory
        id: find-docs
        run: |
          if [ -d "nucleus/nucleus-docs" ]; then
            echo "dir=nucleus/nucleus-docs" >> "$GITHUB_OUTPUT"
          elif [ -d "nucleus/docs" ] && [ -f "nucleus/docs/package.json" ]; then
            echo "dir=nucleus/docs" >> "$GITHUB_OUTPUT"
          else
            echo "dir=nucleus/docs" >> "$GITHUB_OUTPUT"
            echo "needs_init=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize Docusaurus (if needed)
        if: steps.find-docs.outputs.needs_init == 'true'
        run: |
          cd nucleus
          npx create-docusaurus@latest nucleus-docs-build classic --typescript
          cp -r docs/* nucleus-docs-build/docs/ 2>/dev/null || true
          echo "dir=nucleus/nucleus-docs-build" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.find-docs.outputs.dir }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Build Docusaurus site
        working-directory: ${{ steps.find-docs.outputs.dir }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          if [ -f "package.json" ]; then
            npm run build
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find-docs.outputs.dir }}/build

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
