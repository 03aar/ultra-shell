name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.22"
  RUST_VERSION: "1.77"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/nucleus

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: nucleus/nucleus-cli/go.sum

      - name: Build CLI binary
        working-directory: nucleus/nucleus-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::8}" \
            -o "nuc-${{ matrix.target }}${{ matrix.ext }}" .

      - name: Create archive
        working-directory: nucleus/nucleus-cli
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "nuc-${{ matrix.target }}.zip" "nuc-${{ matrix.target }}${{ matrix.ext }}"
          else
            tar czf "nuc-${{ matrix.target }}.tar.gz" "nuc-${{ matrix.target }}${{ matrix.ext }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuc-${{ matrix.target }}
          path: |
            nucleus/nucleus-cli/nuc-${{ matrix.target }}.tar.gz
            nucleus/nucleus-cli/nuc-${{ matrix.target }}.zip

  build-core:
    name: Build Core (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
          - target: darwin-amd64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/nucleus-core/target
          key: rust-${{ matrix.target }}-${{ hashFiles('nucleus/nucleus-core/Cargo.lock') }}

      - name: Build release binary
        working-directory: nucleus/nucleus-core
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.rust_target }}
          cp target/${{ matrix.rust_target }}/release/nucleus-core nucleus-core-${{ matrix.target }} 2>/dev/null || \
          cp target/${{ matrix.rust_target }}/release/nucleus nucleus-core-${{ matrix.target }} 2>/dev/null || true

      - name: Create archive
        working-directory: nucleus/nucleus-core
        run: |
          tar czf "nucleus-core-${{ matrix.target }}.tar.gz" "nucleus-core-${{ matrix.target }}" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-core-${{ matrix.target }}
          path: nucleus/nucleus-core/nucleus-core-${{ matrix.target }}.tar.gz
          if-no-files-found: warn

  build-mcp:
    name: Build MCP Server (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: nucleus/nucleus-mcp/package-lock.json

      - name: Build MCP server
        working-directory: nucleus/nucleus-mcp
        run: |
          npm ci
          npm run build

      - name: Pack tarball
        working-directory: nucleus/nucleus-mcp
        run: npm pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nucleus-mcp-npm
          path: nucleus/nucleus-mcp/*.tgz

  docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-cli, build-core, build-mcp]
    strategy:
      matrix:
        component:
          - nucleus-core
          - nucleus-api
          - nucleus-mcp
          - nucleus-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: nucleus/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cli, build-core, build-mcp, docker-images]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Nucleus ${{ github.ref_name }}
          body: |
            ## Nucleus ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Installation

            **One-line install:**
            ```bash
            curl -fsSL https://install.nucleusshell.dev | bash
            ```

            **CLI binary:**
            Download the appropriate binary below, extract, and place in your PATH.

            **Docker:**
            ```bash
            docker pull ${{ env.IMAGE_PREFIX }}-api:${{ github.ref_name }}
            docker pull ${{ env.IMAGE_PREFIX }}-core:${{ github.ref_name }}
            docker pull ${{ env.IMAGE_PREFIX }}-dashboard:${{ github.ref_name }}
            docker pull ${{ env.IMAGE_PREFIX }}-mcp:${{ github.ref_name }}
            ```

            **MCP Server (npm):**
            ```bash
            npm install -g @nucleus/mcp-server@${{ github.ref_name }}
            ```
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.tgz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
