name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  RUST_VERSION: "1.77"

jobs:
  test-core:
    name: Test nucleus-core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleus/nucleus-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nucleus/nucleus-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('nucleus/nucleus-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

  test-api:
    name: Test nucleus-api (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleus/nucleus-api
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nucleus_test
          POSTGRES_USER: nucleus
          POSTGRES_PASSWORD: nucleus_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nucleus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: nucleus/nucleus-api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        env:
          DATABASE_URL: postgres://nucleus:nucleus_test_password@localhost:5432/nucleus_test?sslmode=disable
          NUCLEUS_REDIS_URL: redis://localhost:6379
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: nucleus/nucleus-api/coverage.out

  test-mcp:
    name: Test nucleus-mcp (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleus/nucleus-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nucleus/nucleus-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test || true

  test-dashboard:
    name: Test nucleus-dashboard (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nucleus/nucleus-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nucleus/nucleus-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint || true

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/api/v1
          NEXT_PUBLIC_API_KEY: test-key
        run: npm run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-core, test-api, test-mcp, test-dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        working-directory: nucleus
        run: |
          cp .env.example .env 2>/dev/null || true
          docker compose up --build -d

      - name: Wait for services to be healthy
        working-directory: nucleus
        run: |
          echo "Waiting for services to start..."
          MAX_RETRIES=30
          RETRY=0
          until curl -sf http://localhost:8080/health > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRIES ]; then
              echo "API failed to start after $MAX_RETRIES attempts"
              docker compose logs nucleus-api
              exit 1
            fi
            echo "  Attempt $RETRY/$MAX_RETRIES — waiting 5s..."
            sleep 5
          done
          echo "API is healthy."

      - name: Verify API health
        run: |
          STATUS=$(curl -sf http://localhost:8080/health | jq -r '.status // empty' 2>/dev/null || echo "unknown")
          echo "API health status: $STATUS"
          if [ "$STATUS" = "unknown" ]; then
            echo "Warning: Could not parse health status, but endpoint responded"
          fi

      - name: Verify dashboard
        run: |
          RETRY=0
          until curl -sf http://localhost:3000 > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge 15 ]; then
              echo "Dashboard failed to start"
              docker compose -f nucleus/docker-compose.yml logs nucleus-dashboard
              exit 1
            fi
            sleep 3
          done
          echo "Dashboard is serving."

      - name: Test API endpoints
        run: |
          echo "Testing /api/v1/context..."
          curl -sf -H "X-API-Key: dev-nucleus-key-local" http://localhost:8080/api/v1/context || true

          echo "Testing /api/v1/executions..."
          curl -sf -H "X-API-Key: dev-nucleus-key-local" http://localhost:8080/api/v1/executions || true

          echo "Testing /api/v1/skills..."
          curl -sf -H "X-API-Key: dev-nucleus-key-local" http://localhost:8080/api/v1/skills || true

      - name: Collect logs on failure
        if: failure()
        working-directory: nucleus
        run: |
          docker compose logs --tail=100
          docker compose ps

      - name: Tear down
        if: always()
        working-directory: nucleus
        run: docker compose down -v
